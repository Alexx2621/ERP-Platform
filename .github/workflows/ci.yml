name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @erp/database run generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # registry.npmjs.org's bulk advisories endpoint has repeatedly timed
      # out here (confirmed against both this sandbox and a real GitHub
      # Actions run, same backoff/timeout pattern in both) — a reliability
      # issue with that endpoint, not with this repo's dependencies. Kept
      # non-blocking so a flaky external service can't turn every PR red;
      # Dependabot security alerts (enabled on this repo, see
      # docs/PROJECT_STATE.md) are the reliable, always-on backstop this
      # step complements rather than replaces.
      - name: Audit dependencies for known high/critical vulnerabilities
        run: pnpm audit --audit-level=high
        continue-on-error: true

  postgres-integration:
    name: PostgreSQL repository integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @erp/api and its workspace dependencies
        run: pnpm turbo run build --filter=@erp/api

      - name: Verify Docker engine
        run: docker version

      - name: Run PostgreSQL integration tests
        run: pnpm --filter @erp/api test:integration

  e2e:
    name: Browser E2E with api+worker, PostgreSQL, Redis and MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @erp/database run generate

      - name: Verify Docker engine
        run: docker version

      - name: Install Playwright Chromium
        run: pnpm --filter @erp/e2e exec playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: pnpm --filter @erp/e2e test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            tmp/playwright/report
            tmp/playwright/test-results
          if-no-files-found: ignore
          retention-days: 14
